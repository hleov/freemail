name = "freemail"
# name = "mail-exhibit"
main = "src/server.js"
compatibility_date = "2024-01-01"
keep_vars=true

# D1 数据库绑定
[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "freemail_db" #你的d1数据库名称
database_id = "9c45cdd7-3d96-4a9d-a1da-4a6f1117e418" # 你的database_id
# 登录会话过期时间（单位：天，默认7天）
# 环境变量
[vars]
# FORWARD_RULES="[{"prefix":"vip","email":"a@example.com"},{"prefix":"*","email":"example@qq.com"}]"
ADMIN_NAME="hle"
ADMIN_PASSWORD="@Xtx164425"
GUEST_PASSWORD="guest"
JWT_TOKEN="dfvhluhdaslufhvdv"
JWT_TOKENGUEST_PASSWORD="dfsfsfxzcv"
SESSION_EXPIRE_DAYS="365"
MAIL_DOMAIN="zb.mk"
RESEND_API_KEY="re_4s6TjjXa_FGDXJTMvCG6b338GeA5qpC9S"
SENDFLARE_API_KEY="SENDFLARE发件密钥"
CYBERPERSONS_API_KEY="CYBERPERSONS发件密钥"


# 静态资源目录（Workers + Assets）
[assets]
directory = "public"
# 显式指定绑定名，确保在 Worker 中通过 env.ASSETS 可用
binding = "ASSETS"


# R2 存储桶绑定（用于保存完整 EML 内容）
[[r2_buckets]]
binding = "MAIL_EML"
bucket_name = "freemail"

